<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings — {{ brand_name }} dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/admin.css">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
</head>
<body class="admin-body">

<header class="admin-top">
  <a class="admin-top__logo" href="/admin">
    <img src="/static/img/favicon.svg" width="30" height="30" alt="">
    <span>
      <strong>{{ brand_name }}</strong>
      <small>Consultant dashboard</small>
    </span>
  </a>
  <nav class="admin-nav" aria-label="Dashboard sections">
    <a href="/admin">Overview</a>
    <a href="/admin/bookings" class="is-current">Bookings</a>
    <a href="/admin/enquiries">Enquiries</a>
    <a href="/" target="_blank" rel="noopener">View site ↗</a>
  </nav>
  <div class="admin-top__actions">
    <button class="icon-btn" id="themeToggle" type="button"
            aria-label="Switch colour theme">
      <span class="icon-btn__sun" aria-hidden="true">☀</span>
      <span class="icon-btn__moon" aria-hidden="true">☾</span>
    </button>
    <div class="admin-user">
      <span class="admin-user__avatar" aria-hidden="true">{{ user_initial }}</span>
      <span class="admin-user__meta">
        <strong>{{ user_name }}</strong>
        <small>{{ user_email }}</small>
      </span>
    </div>
    <a class="btn btn--ghost btn--sm" href="/admin/logout">Sign out</a>
  </div>
</header>

<main class="admin-main">
  <div class="admin-head">
    <div>
      <h1 class="admin-title">Bookings</h1>
      <p class="admin-subtitle" id="resultCount">Loading…</p>
    </div>
    <div class="admin-head__actions">
      <a class="btn btn--ghost btn--sm" id="exportLink" href="/admin/export.csv">
        Export these results
      </a>
    </div>
  </div>

  <section class="card">
    <form class="filters" id="filters">
      <div class="filters__search">
        <label class="sr-only" for="q">Search bookings</label>
        <input type="search" id="q" name="q" value="{{ initial_query }}"
               placeholder="Search name, email, phone, reference or message…"
               autocomplete="off">
      </div>
      <div class="filters__row">
        <div class="field">
          <label for="statusFilter">Status</label>
          <select id="statusFilter" name="status">
            {{ raw_status_filter }}
          </select>
        </div>
        <div class="field">
          <label for="serviceFilter">Service</label>
          <select id="serviceFilter" name="service">
            {{ raw_service_filter }}
          </select>
        </div>
        <div class="field">
          <label for="fromDate">From</label>
          <input type="date" id="fromDate" name="from">
        </div>
        <div class="field">
          <label for="toDate">To</label>
          <input type="date" id="toDate" name="to">
        </div>
        <div class="field">
          <label for="orderBy">Sort</label>
          <select id="orderBy" name="order">
            <option value="slot">Appointment, newest first</option>
            <option value="slot_asc">Appointment, soonest first</option>
            <option value="created">Recently booked</option>
          </select>
        </div>
        <button class="btn btn--ghost btn--sm" type="reset" id="clearFilters">
          Clear
        </button>
      </div>
    </form>

    <div class="table-wrap">
      <table class="table table--full">
        <thead>
          <tr>
            <th scope="col">Reference</th>
            <th scope="col">Appointment</th>
            <th scope="col">Client</th>
            <th scope="col">Service</th>
            <th scope="col">Format</th>
            <th scope="col">Status</th>
            <th scope="col"><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="bookingRows">
          <tr><td colspan="7" class="table__loading">Loading bookings…</td></tr>
        </tbody>
      </table>
    </div>

    <nav class="pager" id="pager" aria-label="Pagination"></nav>
  </section>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="drawer__backdrop" data-close-drawer></div>
  <aside class="drawer__panel" role="dialog" aria-modal="true"
         aria-labelledby="drawerTitle" tabindex="-1">
    <header class="drawer__head">
      <div>
        <p class="drawer__eyebrow" id="drawerRef">—</p>
        <h2 class="drawer__title" id="drawerTitle">Booking</h2>
      </div>
      <button class="drawer__close" type="button" data-close-drawer
              aria-label="Close">✕</button>
    </header>
    <div class="drawer__body" id="drawerBody"></div>
  </aside>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script id="bootData" type="application/json">{{ raw_boot }}</script>
<script src="/static/js/admin.js" defer></script>
</body>
</html>
