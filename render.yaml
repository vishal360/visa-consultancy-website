# Render blueprint. In the Render dashboard: New → Blueprint → pick this repo.
#
# The disk is the important part: without it, data/app.db lives on an ephemeral
# filesystem and every redeploy would delete all your bookings.
services:
  - type: web
    name: visa-consultancy
    runtime: python
    # A paid instance is required to attach a persistent disk. "starter" is the
    # legacy name for the 0.5 CPU / 512 MB plan, which Render's dashboard now
    # labels "0.5c-512mb" after its August 2026 rename. Legacy names still work
    # in Blueprints, and 512 MB is ample for a zero-dependency stdlib app.
    plan: starter
    region: singapore # closest Render region to India; also: frankfurt, oregon, ohio, virginia
    branch: main

    # No dependencies to install, so this is a no-op that just satisfies Render.
    buildCommand: "python3 --version"
    startCommand: "python3 run.py"

    # Cheaper than rendering the whole homepage, and it verifies the database
    # is reachable rather than just that the process is alive.
    healthCheckPath: /healthz

    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

    envVars:
      # --- set these yourself ---
      - key: ADMIN_EMAIL
        sync: false # prompts you in the dashboard
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAILS
        sync: false
      - key: BASE_URL
        sync: false # e.g. https://visa-consultancy.onrender.com

      # --- production hardening ---
      - key: DEBUG
        value: "false"
      - key: SECURE_COOKIES
        value: "true"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.6"
