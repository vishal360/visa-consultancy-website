<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160"
     role="img" aria-label="V&amp;P UkraLink — Ukraine visa and immigration consultants">
  <title>V&amp;P UkraLink</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16376f"/>
      <stop offset="1" stop-color="#071531"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4d8dff"/>
      <stop offset="0.55" stop-color="#e6b422"/>
      <stop offset="1" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(0 24) scale(0.21875)">
    <rect width="512" height="512" rx="116" fill="url(#badge)"/>
    <path d="M0 116A116 116 0 0 1 116 0h140L0 256Z" fill="#ffffff" opacity="0.05"/>
    <path d="M138 372C206 372 244 206 374 156" fill="none" stroke="url(#path)"
          stroke-width="30" stroke-linecap="round"/>
    <circle cx="138" cy="372" r="27" fill="#8fbaff"/>
    <circle cx="374" cy="156" r="38" fill="#ffd700"/>
    <circle cx="374" cy="156" r="15" fill="#071531"/>
  </g>

  <!-- Wordmark -->
  <text x="142" y="86" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.4">
    <tspan fill="#ffd700">V&amp;P</tspan><tspan fill="#0b1f4d" dx="12">UkraLink</tspan>
  </text>

  <!-- Tagline -->
  <text x="144" y="122" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="2.6" fill="#4d5f80">
    UKRAINE VISA CONSULTANTS
  </text>
</svg>
