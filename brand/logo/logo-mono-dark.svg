<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160"
     role="img" aria-label="V&amp;P UkraLink">
  <title>V&amp;P UkraLink — single colour, for light backgrounds</title>
  <defs>
    <!-- White shows the badge, black knocks the route back out of it, so the
         whole mark renders in exactly one colour. -->
    <mask id="knockout">
      <rect width="512" height="512" fill="#ffffff"/>
      <path d="M138 372C206 372 244 206 374 156" fill="none" stroke="#000000"
            stroke-width="30" stroke-linecap="round"/>
      <circle cx="138" cy="372" r="27" fill="#000000"/>
      <circle cx="374" cy="156" r="38" fill="#000000"/>
      <circle cx="374" cy="156" r="15" fill="#ffffff"/>
    </mask>
  </defs>

  <g transform="translate(0 24) scale(0.21875)">
    <rect width="512" height="512" rx="116" fill="#0b1f4d" mask="url(#knockout)"/>
  </g>

  <text x="142" y="86" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.4" fill="#0b1f4d">
    V&amp;P UkraLink
  </text>
  <text x="144" y="122" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="2.6" fill="#0b1f4d" opacity="0.66">
    UKRAINE VISA CONSULTANTS
  </text>
</svg>
